<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="trainGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background Container with rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)"/>
  
  <!-- Train & Food Cloche Visual -->
  <g filter="url(#glow512)">
    <!-- Main Train Engine Shape -->
    <path d="M140 120 C140 100 160 85 186 85 L326 85 C352 85 372 100 372 120 L372 336 C372 356 352 372 326 372 L186 372 C160 372 140 356 140 336 Z" fill="url(#trainGrad512)"/>
    
    <!-- Windshield -->
    <rect x="166" y="118" width="180" height="90" rx="20" fill="#1e293b"/>
    <path d="M176 128 L270 128 L236 196 L176 196 Z" fill="#38bdf8" opacity="0.65"/>
    
    <!-- Train Headlights -->
    <circle cx="192" cy="320" r="18" fill="#fbbf24"/>
    <circle cx="320" cy="320" r="18" fill="#fbbf24"/>
    
    <!-- Center Food Cloche Symbol on Train Grille -->
    <path d="M214 270 C214 246 298 246 298 270 Z" fill="#ff6b00"/>
    <line x1="202" y1="276" x2="310" y2="276" stroke="#ff6b00" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="240" r="8" fill="#ff6b00"/>
    
    <!-- Speed Tracks under the train -->
    <line x1="112" y1="410" x2="400" y2="410" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <line x1="160" y1="436" x2="352" y2="436" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
