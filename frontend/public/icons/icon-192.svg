<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background Container with rounded squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Train & Food Cloche Visual -->
  <g filter="url(#glow)">
    <!-- Main Train Engine Shape -->
    <path d="M52 46 C52 38 60 32 70 32 L122 32 C132 32 140 38 140 46 L140 126 C140 134 132 140 122 140 L70 140 C60 140 52 134 52 126 Z" fill="url(#trainGrad)"/>
    
    <!-- Windshield -->
    <rect x="62" y="44" width="68" height="34" rx="8" fill="#1e293b"/>
    <path d="M66 48 L100 48 L88 74 L66 74 Z" fill="#38bdf8" opacity="0.6"/>
    
    <!-- Train Headlights -->
    <circle cx="72" cy="120" r="7" fill="#fbbf24"/>
    <circle cx="120" cy="120" r="7" fill="#fbbf24"/>
    
    <!-- Center Food Cloche Symbol on Train Grille -->
    <path d="M80 102 C80 93 112 93 112 102 Z" fill="#ff6b00"/>
    <line x1="76" y1="104" x2="116" y2="104" stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="96" cy="91" r="3" fill="#ff6b00"/>
    
    <!-- Speed Tracks under the train -->
    <line x1="42" y1="154" x2="150" y2="154" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <line x1="60" y1="164" x2="132" y2="164" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
