<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="trainGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>
  
  <!-- Safe zone center train graphics (within 80% safe circle) -->
  <g transform="translate(25.6, 25.6) scale(0.9)" filter="url(#glowMask)">
    <!-- Main Train Engine Shape -->
    <path d="M150 130 C150 110 170 95 195 95 L317 95 C342 95 362 110 362 130 L362 336 C362 356 342 372 317 372 L195 372 C170 372 150 356 150 336 Z" fill="url(#trainGradMask)"/>
    
    <!-- Windshield -->
    <rect x="174" y="128" width="164" height="84" rx="18" fill="#1e293b"/>
    <path d="M184 136 L270 136 L240 200 L184 200 Z" fill="#38bdf8" opacity="0.65"/>
    
    <!-- Train Headlights -->
    <circle cx="198" cy="320" r="16" fill="#fbbf24"/>
    <circle cx="314" cy="320" r="16" fill="#fbbf24"/>
    
    <!-- Center Food Cloche Symbol -->
    <path d="M220 270 C220 248 292 248 292 270 Z" fill="#ff6b00"/>
    <line x1="208" y1="276" x2="304" y2="276" stroke="#ff6b00" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="242" r="7" fill="#ff6b00"/>
    
    <!-- Tracks -->
    <line x1="120" y1="404" x2="392" y2="404" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <line x1="165" y1="428" x2="347" y2="428" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
