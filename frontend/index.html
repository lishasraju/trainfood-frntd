<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>RailBite - Train Food Delivery | IRCTC Partner Seat Catering</title>
  <meta name="description" content="Order fresh, hot, and hygienic restaurant food delivered directly to your train seat. Search by PNR or Train number. 100% Pure Veg, Jain, and Halal options available." />
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#ff6b00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RailBite" />
  <meta name="application-name" content="RailBite" />
  <meta name="msapplication-TileColor" content="#ff6b00" />
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('✅ RailBite PWA ServiceWorker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.warn('⚠️ RailBite PWA ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
